# Map profile for drawland: the card, its layers, and how each is drawn.
#
# Fill generators (penfill): rectilinear zigzag lines grid triangles honeycomb
#   dots waves wave_grid scales sunburst spiral concentric hilbert stipple
#   grass gravel scribble truchet marble wood cracks terrazzo chess pat none
# Or draw an SVG into a region instead: fill: { source: { file: art.svg } }
# Outline strokes: solid | dash | dotted | none

map:
  width: 6in
  height: 4in
  scale: "1:10000"
  bearing: 0
  projection: webmercator          # utm | webmercator
  # Default location; --address / --lat --lng override.
  # address: "1730 Highland Pl, Berkeley, CA 94709"
  # lat: 37.8771145
  # lng: -122.256196

# Listed bottom-most first: each layer is clipped by the areas of the layers
# after it (roads cross parks; buildings punch roads out).
layers:
  - id: parks
    module: parks/v1
    # Every kind inherits this, then applies its own entry. A bare length
    # sets only the spacing.
    fill: { generator: dots, spacing: 0.50mm, angle: 45, mark: 0.2mm }
    kinds:
      garden: { generator: dots, spacing: 0.25mm }
      park: 0.45mm
      wood: { generator: dots, spacing: 0.70mm }
      grass: { generator: dots, spacing: 0.85mm }
    options:
      leftover: wood       # which kind fills area only the union covers
    stroke: { style: dash, dash: 0.45mm, gap: 0.40mm }

  - id: water
    module: water/v1
    fill: { generator: waves, spacing: 0.75mm, angle: 0 }
    stroke: { style: solid }

  - id: roads
    module: roads/v1

  - id: buildings
    module: buildings/v1
    fill: { generator: zigzag, spacing: 0.5mm, angle: 45 }
