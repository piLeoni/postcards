# Project settings (map + plotter). Swap file / pass --config for another machine.
# Used by: postcards/make_map.py, optimize.py, export_gcode.py, vpype gwrite.

# --- postcard / map (SVG generation) ----------------------------------------
[map]
# Physical card size (mm or with unit: "6in", "152.4mm").
width = "6in"
height = "4in"
scale = "1:10000"
bearing = 0
projection = "utm"
# Margin inside the card (mm). Keep in sync with [optimize].trim for now.
padding_mm = 3
# Optional default location; CLI --address / --lat/--lng overrides.
# address = "1730 Highland Pl, Berkeley, CA 94709"
# lat = 37.8771145
# lng = -122.256196

# --- area fills (optional; omit to keep the historical card-wide hatch) ------
# See docs/fills.md. Algorithms:
#   rectilinear | concentric | zigzag | spiral | grid | honeycomb | hilbert
[fill.buildings]
algorithm = "zigzag"
spacing = "0.5mm"
angle = 45
# Optional per-algorithm options:
# [fill.buildings.zigzag]
# connector = "band"       # band | boundary | none

# --- path optimization (vpype) ----------------------------------------------
# Shared defaults. A layer may override any of these in its [layers.*] section.
[optimize]
trim = "3mm"
penwidth = "0.1mm"
snap = "0.05mm"
simplify = "0.1mm"
linemerge = "0.25mm"
fill_merge = "0.3mm"
filter_min = "0.15mm"
linesort_passes = 1000
# Two-opt linesort (shorter travel). Set false for faster / less reorder.
linesort_two_opt = true

# --- per-layer vpype pipelines ----------------------------------------------
# Each layer lists the vpype operations to run on it, in order, by name.
# Adding a layer to the map means adding a section here — no code change.
#
# Available ops: snap | linesimplify | linemerge | filter | linesort
#   linesimplify / linemerge / filter accept a tolerance: "0.1mm"
#   linesort accepts -t (two-opt) and -f (follow / no reorder of first point)
#
# Never use vpype `deduplicate` on a multi-layer document: it ignores -l and
# merges every layer into layer 1, wiping the fillings.

[layers.outlines]
ops = [
  { name = "snap", tolerance = "0.05mm" },
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.roads_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.roads_details]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_details]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_filling]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  # Fill hatch merges more aggressively so the diagonals read as one stroke.
  { name = "linemerge", tolerance = "0.3mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

[layers.parks_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

# Dots are independent ~0.05mm dabs. Do NOT filter them (filter_min 0.15mm
# would wipe the whole layer), and do not linemerge (would stitch marks into
# streaks). Sort with follow only so the grid order stays a raster scan.
[layers.parks_filling]
ops = [
  { name = "linesort", two_opt = false, follow = true },
]

[layers.water_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

# Waves are already continuous polylines; merging them is wasteful.
[layers.water_filling]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true, follow = true },
]

# --- bed placement (SVG page → machine coords) ------------------------------
[placement]
# Usable bed after home (mm).
bed_width_mm = 200.0
bed_height_mm = 140.0
# Where the SVG page top-left corner goes in machine space.
origin_x_mm = 0.0
origin_y_mm = 140.0
# SVG +Y is down; machine +Y is toward home (north). Flip before shift.
flip_y = true
# "page" keeps postcard padding; "content" packs ink to the origin (eats margin).
anchor = "page"
# Drop consecutive G0/G1 moves shorter than this (mm) when scrubbing output.
scrub_min_mm = 0.15
# Write one G-code file per SVG layer (same detail, smaller files FluidNC can open).
split_layers = true
# Further split any file over this many lines (0 = off). Keeps all geometry.
max_lines_per_file = 8000
# Append $SD/Run=/<job>/part_N+1.gcode at end of each part (FluidNC job nesting).
chain_parts = true

# --- feeds (mm/min and Z heights) — declare once, referenced as $name below --
[feeds]
travel_xy = 8000   # G0 between strokes
pen_z = 2000       # pen up/down (use G1 so F is honored)
draw_xy = 3500     # ink on paper
pen_up = 4         # Z when pen is up
pen_down = 0       # Z when drawing

# --- gcode writer (vpype-gcode profile) --------------------------------------
# NOT FluidNC config. vpype-gcode fills {x}/{y}; export expands $feeds names
# first, then hands the result to vpype. Output is normal Grbl/FluidNC G-code.
[gwrite.plotter]
unit = "mm"
invert_y = false

document_start = """G21
G90
G94
G10 L2 P1 X0 Y0 Z0
G92.1
$HZ
$H
G1 Z$pen_up F$pen_z
"""

layer_start = ""
line_start = ""

segment_first = """G0 X{x:.4f} Y{y:.4f} F$travel_xy
G1 Z$pen_down F$pen_z
"""
segment = """G1 X{x:.4f} Y{y:.4f} F$draw_xy
"""
line_end = """G1 Z$pen_up F$pen_z
"""

document_end = """G1 Z$pen_up F$pen_z
G10 L2 P1 X0 Y0 Z0
G92.1
$HZ
$H
G1 Z$pen_up F$pen_z
"""
