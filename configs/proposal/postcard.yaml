# NOT IMPLEMENTED — configs/postcard.yaml written in the grammar proposed in
# docs/profile.md. Same card, same look; postcards-rs can't read it yet.
#
# How to read it:
#   card    the paper: size, scale, rotation, projection
#   stack   what is drawn, top first: each layer hides the ones below it
#   areas   named shapes, computed once, used by name (none needed here)
#   layers  what each layer is (select / area) and how it's drawn
#           (outline / details / fill). What isn't written isn't drawn.

card:
  width: 6in
  height: 4in
  scale: "1:10000"
  bearing: 0
  projection: utm            # utm | webmercator
  # Default location; --address / --lat --lng override.
  # address: "1730 Highland Pl, Berkeley, CA 94709"

stack:
  - buildings                # on top of everything
  - roads                    # hidden under buildings, hides water and parks
  - water
  - parks                    # at the bottom

layers:
  buildings:
    select: { building: true }                  # the area: union of the footprints
    outline: solid
    details: { shared_walls: solid }            # walls between touching buildings
    fill: { pattern: zigzag, spacing: 0.5mm, angle: 45, per: feature }

  roads:
    module: roads/v1                            # ways buffered to their real width, bridges stacked
    outline: solid
    details:
      centerlines: { style: dash, dash: 0.3mm, gap: 0.35mm }   # ways ≥ 6 m wide
      bridge_seams: solid                                       # where a deck crosses a road below

  water:
    select: { water: true, natural: water }
    area: { from: [features, ocean] }           # lakes and rivers, plus the sea on coastal cards
    outline: solid
    fill: { pattern: waves, spacing: 0.75mm, angle: 0 }

  # Parks: a small stack of kinds. A kind higher in the list claims its area
  # first, so a garden inside a park is dotted once, with the garden spacing.
  parks:
    group: [garden, park, wood, grass, wild]
    area: { fill_holes: true }                  # ponds and courtyards inside parks are covered
    outline: { style: dash, dash: 0.45mm, gap: 0.40mm, rings: exterior }
    fill: { pattern: dots, angle: 45, mark: 0.2mm }   # every kind inherits this

  garden:
    select: { leisure: garden }
    fill: { spacing: 0.25mm }
  park:
    select: { leisure: park }
    fill: { spacing: 0.45mm }
  wood:
    select: { natural: wood, landuse: forest, leisure: nature_reserve }
    fill: { spacing: 0.70mm }
  grass:
    select: { landuse: [grass, meadow], natural: grassland }
    fill: { spacing: 0.85mm }
  wild:
    area: rest                                  # inside parks, claimed by no kind above
    fill: { spacing: 0.70mm }
