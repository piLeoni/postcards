# configs/postcard.yaml scritto nella grammatica v3 (docs/profile.md).
# IMPLEMENTATO: postcards-core::grammar lo legge e lo valida. Serve a vedere come
# la cartolina di oggi verrebbe scritta, e a tenere allineati documento e parser.
#
# ============================================================================
# LE TRE REGOLE, IN BREVE
#
# 1. Sezione col $ = contenuto TUO. Sezione senza $ = schema del motore.
#      $features  selezione OSM (solo filtri di tag)
#      $areas     aree (multi-poligoni in mm di cartolina)
#      $lines     insiemi di linee
#      $fills     pattern penfill (linee gia' generate)
#      card, draw, compose   schema fisso
#
# 2. Nel dubbio di chi ha scritto un nome, guardi il prefisso:
#      $areas.river      tuo, definito in questo file
#      tools_union       kit del motore (lista chiusa)
#      osm_select        sorgente dati del motore
#      engine_ocean      geometria calcolata dal motore (fuori da OSM)
#      module_roads      codice compilato; i suoi output sono roads.area, roads.outlines, ...
#
# 3. Un nome puo' ripetersi tra sezioni: $areas.river, $lines.river, $fills.river
#    sono tre cose diverse (area, anelli, tratteggio) con lo stesso nome base.
#    Nei riferimenti scrivi sempre la sezione, quindi non si confondono mai.
#
# ============================================================================
# TOOLKIT
#
# SORGENTI
#   osm_select: { <tag>: <valore> | [valori] | true }   feature OSM (except:, underground:)
#   tiles_select: [buildings, "landcover:park,garden"]  feature dalle tile vettoriali
#                                              (OpenFreeMap, schema OpenMapTiles): preset e
#                                              regole layer:class di terramask; niente Overpass
#
# AREE
#   tools_polygons: <feature>                  area: unione dei poligoni
#   tools_union: [a, b, ...]                   unione
#   tools_difference: { base:, cut: }          base meno cut (cut anche lista)
#   tools_intersect: { base:, keep: }          base limitata a keep
#   tools_fill_holes: <area>                   chiude i buchi (laghi dentro i parchi)
#   tools_grow: { of:, by: +-len }             dilata / restringe (negativo = restringe)
#   engine_card: {}                            area: il rettangolo della cartolina
#   engine_ocean: {}                           area: il mare, dalle tile di costa.
#                                              NON e' un tag OSM: e' una funzione del
#                                              host, vuota se la carta non tocca la costa.
#
# LINEE
#   tools_rings: <area> | { of:, exterior_only: }   anelli dei poligoni
#   tools_lines: <feature>                     tutte le linestring di quelle feature
#   tools_segments: <feature>                  ogni lato di ogni poligono + le linee (muri)
#   tools_dedupe: <linee>                      fonde i segmenti doppi
#   tools_clip: { lines:, within:, invert: }   tiene dentro / fuori da un'area
#   tools_merge: <linee>                       unisce linee contigue
#   tools_join: [a, b, ...]                    concatena insiemi di linee
#
# FILL  (producono linee; il pattern lo disegna penfill)
#   tools_fill: { in: <area>, pattern:, ... }              un giro sull'unione
#   tools_fill: { in: <area>, per: feature, pattern:, ... } un giro per ogni poligono
#
# MODULI  (solo strade: larghezze, z-index, ponti)
#   module_roads: {}   ->  pubblica  roads.area, roads.outlines, roads.details, roads.trails
#
# PRIMITIVES  (una catena di tools con un nome; vedi docs/profile.md)
#   primitives_<nome>: { from: <feature> }  ->  pubblica i quattro output fissi:
#     .outlines  .details  .filling  .mask
#   I quattro ci sono sempre (vuoti se non servono). Dentro la primitiva si usa
#   solo tools_*: se serve una tabella, un ciclo o dell'aritmetica, e' un modulo.
#
# DRAW / COMPOSE
#   draw: [ { id:, from: <linee>, stroke: solid | dash | dotted | none | { } } ]
#   compose.order         id di draw, dal basso verso l'alto
#   compose.masks         <nome>: { from: <area>, occludes: [id di draw, ...] }
#   compose.clip          default: auto | none | [riferimenti]
# ============================================================================


card:
  width: 6in
  height: 4in
  scale: "1:10000"
  bearing: 0
  projection: webmercator
  # address: "1730 Highland Pl, Berkeley, CA 94709"   # --address / --lat --lng la scavalcano


# --------------------------------------------------------------------------
# FEATURE: solo filtri di tag. Non si disegnano, servono alle aree e alle linee.
# --------------------------------------------------------------------------
$features:
  garden: { osm_select: { leisure: garden } }
  park:   { osm_select: { leisure: park } }
  wood:   { osm_select: { natural: wood, landuse: forest, leisure: nature_reserve } }
  grass:  { osm_select: { landuse: [grass, meadow], natural: grassland } }
  wet:    { osm_select: { water: true, natural: water } }
  bldg:   { osm_select: { building: true } }


# --------------------------------------------------------------------------
# AREE: la geometria che occlude. Ogni tipo di parco rivendica la sua area
# togliendo quelli sopra di lui, cosi' un giardino dentro un parco viene
# punteggiato una volta sola. `parks_ext` chiude i buchi: e' il bordo esterno
# ed e' anche la maschera.
# --------------------------------------------------------------------------
$areas:
  garden: { tools_polygons: $features.garden }
  park_p: { tools_polygons: $features.park }
  wood_p: { tools_polygons: $features.wood }
  grass_p: { tools_polygons: $features.grass }
  park:   { tools_difference: { base: $areas.park_p,  cut: $areas.garden } }
  wood:   { tools_difference: { base: $areas.wood_p,  cut: [$areas.garden, $areas.park] } }
  grass:  { tools_difference: { base: $areas.grass_p, cut: [$areas.garden, $areas.park, $areas.wood] } }

  parks:     { tools_union: [$areas.garden, $areas.park, $areas.wood, $areas.grass] }
  parks_ext: { tools_fill_holes: $areas.parks }
  # I buchi che `parks_ext` chiude (cortili, spiazzi): nessun tipo li
  # punteggia, quindi li punteggia `wild`, con lo stesso passo degli altri.
  wild:      { tools_difference: { base: $areas.parks_ext, cut: $areas.parks } }

  # Acqua: due sorgenti diverse. I corpi interni sono tag OSM, il mare e' una
  # funzione del motore. Le uniamo per avere un solo disegno, ma restano due
  # nomi separati se un giorno servono distinti (es. solo laghi, solo mare).
  inland: { tools_polygons: $features.wet }
  sea:    { engine_ocean: {} }
  wet:    { tools_union: [$areas.inland, $areas.sea] }

  # Edifici: dissoluzione unica per bordo e maschera; la banda ritirata di
  # 0.1 mm serve a scegliere i muri interni (vedi $lines.shared_walls).
  footprints: { tools_polygons: $features.bldg }
  dissolved:  { tools_union: [$areas.footprints] }
  inner_band: { tools_grow: { of: $areas.dissolved, by: -0.1mm } }

  # Strade: unico modulo. Larghezze, z-index dei ponti e giunti non si scrivono
  # nel profilo. Il modulo pubblica output nominati, il profilo sceglie quali usare.
  roads: { module_roads: {} }


# --------------------------------------------------------------------------
# LINEE: quello che diventa inchiostro con un tratto.
# --------------------------------------------------------------------------
$lines:
  parks_edge: { tools_rings: { of: $areas.parks_ext, exterior_only: true } }
  wet_ring:   { tools_rings: $areas.wet }

  # Bordo degli edifici: gli anelli della dissoluzione, piu' le eventuali
  # feature lineari (raro: un edificio mappato come linea).
  dissolved_rings: { tools_rings: $areas.dissolved }
  bldg_lines:      { tools_lines: $features.bldg }
  building_outline: { tools_join: [$lines.dissolved_rings, $lines.bldg_lines] }

  # "Dettagli" degli edifici: non gli anelli interni del poligono, ma i segmenti
  # condivisi fra edifici che cadono DENTRO la dissoluzione ritirata di 0.1 mm.
  bldg_segments: { tools_segments: $features.bldg }
  bldg_dedupe:   { tools_dedupe: $lines.bldg_segments }
  shared_walls:  { tools_clip: { lines: $lines.bldg_dedupe, within: $areas.inner_band } }


# --------------------------------------------------------------------------
# FILL: penfill dentro un'area. Stesso nome base delle aree, sezione diversa.
# --------------------------------------------------------------------------
$fills:
  garden: { tools_fill: { in: $areas.garden, pattern: dots, spacing: 0.45mm, mark: 0.2mm, angle: 45 } }
  park:   { tools_fill: { in: $areas.park,   pattern: dots, spacing: 0.45mm, mark: 0.2mm, angle: 45 } }
  wood:   { tools_fill: { in: $areas.wood,   pattern: dots, spacing: 0.45mm, mark: 0.2mm, angle: 45 } }
  grass:  { tools_fill: { in: $areas.grass,  pattern: dots, spacing: 0.45mm, mark: 0.2mm, angle: 45 } }
  wild:   { tools_fill: { in: $areas.wild,   pattern: dots, spacing: 0.45mm, mark: 0.2mm, angle: 45 } }
  wet:    { tools_fill: { in: $areas.wet,    pattern: waves, spacing: 0.75mm, angle: 0 } }
  bldg:   { tools_fill: { in: $areas.footprints, per: feature, pattern: zigzag, spacing: 0.5mm, angle: 45 } }


# --------------------------------------------------------------------------
# DRAW: cosa diventa inchiostro, con che id di gruppo SVG e che stile.
# `id` e' libero (non e' una variabile, e' il nome del gruppo); `from` invece
# deve essere un insieme di linee, tuo ($lines / $fills) o di un modulo.
# --------------------------------------------------------------------------
draw:
  - { id: parks_ring, from: $lines.parks_edge, stroke: { style: dash, dash: 0.45mm, gap: 0.40mm } }
  - { id: parks_fill_g, from: $fills.garden }
  - { id: parks_fill_p, from: $fills.park }
  - { id: parks_fill_w, from: $fills.wood }
  - { id: parks_fill_r, from: $fills.grass }
  - { id: parks_fill_x, from: $fills.wild }
  - { id: water_ring, from: $lines.wet_ring, stroke: solid }
  - { id: water_fill, from: $fills.wet }
  - { id: roads_out, from: roads.outlines, stroke: solid }
  - { id: roads_trail, from: roads.trails, stroke: solid }
  - { id: roads_center, from: roads.centerlines, stroke: { style: dash, dash: 0.3mm, gap: 0.35mm } }
  - { id: roads_seam, from: roads.seams, stroke: solid }
  - { id: bldg_wall, from: $lines.shared_walls, stroke: solid }
  - { id: bldg_fill, from: $fills.bldg }
  - { id: bldg_ring, from: $lines.building_outline, stroke: solid }


# --------------------------------------------------------------------------
# COMPOSE: ordine, maschere, clip.
# --------------------------------------------------------------------------
compose:
  # bottom --> top, come la lista Python di oggi (parchi, acqua, strade, edifici)
  order:
    - parks_ring
    - parks_fill_g
    - parks_fill_p
    - parks_fill_w
    - parks_fill_r
    - parks_fill_x
    - water_ring
    - water_fill
    - roads_out
    - roads_trail
    - roads_center
    - roads_seam
    - bldg_wall
    - bldg_fill
    - bldg_ring

  # Chi copre il disegno sotto di se' e quali id colpisce. Un id senza voce qui
  # non taglia niente: disegna e basta (es. un tratteggio di scuole sopra tutto).
  # `from` vuole un'area: $areas.* oppure un output di modulo come roads.area.
  masks:
    parks_cover:
      from: $areas.parks_ext
      occludes: [water_fill, water_ring, roads_out, roads_trail, roads_center, roads_seam, bldg_wall, bldg_fill, bldg_ring]
    wet_cover:
      from: $areas.wet
      occludes: [parks_fill_g, parks_fill_p, parks_fill_w, parks_fill_r, parks_fill_x, parks_ring, roads_out, roads_trail, roads_center, roads_seam, bldg_wall, bldg_fill, bldg_ring]
    roads_cover:
      from: roads.area
      occludes: [parks_fill_g, parks_fill_p, parks_fill_w, parks_fill_r, parks_fill_x, parks_ring, water_fill, water_ring]
    bldg_cover:
      from: $areas.dissolved
      occludes: [parks_fill_g, parks_fill_p, parks_fill_w, parks_fill_r, parks_fill_x, parks_ring, water_fill, water_ring, roads_out, roads_trail, roads_center, roads_seam]

  clip:
    default: auto     # ogni id tagliato dalle maschere sopra di lui che lo elencano


# ============================================================================
# PRIMITIVES — come sarebbero scritte sopra, se le avessimo.
#
# NON IMPLEMENTATE: il parser riconosce il prefisso e rifiuta. Serve a fissare la
# forma. Una primitiva e' una catena di tools_*, dichiarata una volta e chiamata
# per nome; pubblica sempre gli stessi quattro output, presi dal contratto
# Python LayerParts(outlines, details, filling, mask).
#
# Con questa definizione, il blocco $areas ed $lines di sopra (da `park_p` a
# `shared_walls`) sparisce, e il profilo diventa:
#
#   $areas:
#     bldg: { primitives_buildings: { from: $features.bldg } }
#   draw:
#     - { id: bldg_ring, from: $areas.bldg.outlines, stroke: solid }
#     - { id: bldg_wall, from: $areas.bldg.details, stroke: solid }
#     - { id: bldg_fill, from: $areas.bldg.filling }
#   compose:
#     masks:
#       bldg_cover: { from: $areas.bldg.mask, occludes: [...] }
#
# I parchi sono il caso che rende `$recipes` utile davvero: quattro kind, la
# stessa catena ripetuta. Il parametro e' `from:`, gli altri nomi restano fissi.
# ============================================================================

