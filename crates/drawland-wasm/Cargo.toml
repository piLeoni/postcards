[package]
name = "drawland-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly bindings for draw.land: profile + OSM data in, SVG out"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drawland-core.workspace = true
penfill.workspace = true
terramask = { workspace = true, features = ["dem"] }
geo.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
