[package]
name = "drawland-script-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WebAssembly bindings for draw.land's script interpreter: a profile script in, its graph out"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drawland-script.workspace = true
# The browser backend for the randomness and time Boa links in (scripts see neither).
boa_engine = { version = "0.22", default-features = false, features = ["js"] }
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
