[package]
name = "postcards-cli"
description = "postcards map stage: fetch OSM, render the layered SVG"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "postcards-rs"
path = "src/main.rs"

[dependencies]
postcards-core = { workspace = true }
clap = { workspace = true }
geo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
terramask = { workspace = true, features = ["fetch"] }
sha1_smol = { workspace = true }
libc = "0.2"
