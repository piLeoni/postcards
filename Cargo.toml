[workspace]
members = ["crates/postcards-core", "crates/postcards-cli", "crates/postcards-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
postcards-core = { path = "crates/postcards-core" }
penfill = { path = "../penfill" }
# Reads tiles only; the CLI turns `fetch` on, the page downloads them itself.
terramask = { path = "../terramask/crates/terramask", version = "0.2.0", default-features = false }
geo = "0.33"
geographiclib-rs = "0.2"
# Without default features: the aeqd projection pulls in C, which the WASM build cannot compile.
proj4rs = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
json5 = "1.3"
thiserror = "2"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
sha1_smol = "1"
approx = "0.5"

[profile.release]
lto = "thin"
