[workspace]
members = ["crates/drawland-core", "crates/drawland-script", "crates/drawland-cli", "crates/drawland-wasm", "crates/drawland-script-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
drawland-core = { path = "crates/drawland-core" }
drawland-script = { path = "crates/drawland-script" }
penfill = { path = "../penfill" }
# Pen-and-ink terrain drawing: its own engine, its own expression trees.
burin-map-core = { path = "../burin-map/crates/burin-map-core", version = "0.1.0" }
# Reads tiles only; the CLI turns `fetch` on, the page downloads them itself.
terramask = { path = "../terramask/crates/terramask", version = "0.2.0", default-features = false }
geo = "0.33"
geographiclib-rs = "0.2"
# Without default features: the aeqd projection pulls in C, which the WASM build cannot compile.
proj4rs = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.3"
thiserror = "2"
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
sha1_smol = "1"
approx = "0.5"

[profile.release]
lto = "thin"

# The script interpreter's WASM module: loaded only when a script runs, so
# built for size.
[profile.wasm-script]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
