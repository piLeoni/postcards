[project]
name = "postcards"
version = "1.0.0"
description = "Generate pen-plotted postcards of any address from OpenStreetMap data"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:shapely",
    "ignore:GeoSeries.notna:UserWarning",
    # pyproj touches a deprecated numpy scalar conversion we cannot fix.
    "ignore:Conversion of an array with ndim > 0:DeprecationWarning",
]
