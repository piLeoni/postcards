# Project settings (map + plotter). Swap file / pass --config for another machine.
# Used by: postcards/make_map.py, optimize.py, export_gcode.py, vpype gwrite.

# --- postcard / map (SVG generation) ----------------------------------------
[map]
# Physical card size (mm or with unit: "6in", "152.4mm").
width = "6in"
height = "4in"
scale = "1:10000"
bearing = 0
projection = "utm"
# Margin inside the card (mm). Keep in sync with [optimize].trim for now.
padding_mm = 3
# Optional default location; CLI --address / --lat/--lng overrides.
# address = "1730 Highland Pl, Berkeley, CA 94709"
# lat = 37.8771145
# lng = -122.256196

# --- area fills / outline strokes (theme styling; geometry still in code) ---
# Algorithms:
#   rectilinear | concentric | zigzag | spiral | grid | honeycomb | hilbert
#   dots | waves
# Any theme can use any algorithm — swap freely.
# See docs/fills.md.
[fill.buildings]
algorithm = "zigzag"
spacing = "0.75mm"
angle = 45
# Optional per-algorithm options:
[fill.buildings.zigzag]
connector = "boundary"       # band (straight, then perimeter) | boundary | none

[fill.water]
algorithm = "waves"
spacing = "0.75mm"
angle = 0

[fill.parks]
# Theme defaults — each kind inherits these unless it overrides.
algorithm = "dots"
angle = 45
mark = "0.2mm"
spacing = "0.50mm"
leftover = "wood"        # which kind's settings fill union-only gaps

# Per-kind fills: full tables (algorithm + knobs), or a bare length for spacing
# only. Any algorithm works — garden can be dots while wood is waves.
[fill.parks.kinds.garden]
algorithm = "dots"
spacing = "0.25mm"

[fill.parks.kinds.park]
spacing = "0.45mm"       # inherits algorithm = dots

[fill.parks.kinds.wood]
algorithm = "dots"
spacing = "0.70mm"

[fill.parks.kinds.grass]
algorithm = "dots"
spacing = "0.85mm"
# Example of a different pattern:
# algorithm = "rectilinear"
# angle = 30

# Outline stroke styles: solid | dash | dotted
[stroke.parks]
style = "dash"
dash = "0.45mm"
gap = "0.40mm"

[stroke.water]
style = "solid"

# --- path optimization (vpype) ----------------------------------------------
# Shared defaults. A layer may override any of these in its [layers.*] section.
[optimize]
trim = "3mm"
penwidth = "0.1mm"
snap = "0.05mm"
simplify = "0.1mm"
linemerge = "0.25mm"
fill_merge = "0.3mm"
filter_min = "0.15mm"
linesort_passes = 1000
# Two-opt linesort (shorter travel). Set false for faster / less reorder.
linesort_two_opt = true

# --- per-layer vpype pipelines ----------------------------------------------
# Each layer lists the vpype operations to run on it, in order, by name.
# Adding a layer to the map means adding a section here — no code change.
#
# Available ops: snap | linesimplify | linemerge | filter | deoverlap | linesort
#   linesimplify / linemerge / filter / deoverlap accept a tolerance: "0.1mm"
#   deoverlap also accepts: prefer, angle, self_overlap, min_length, drop
#   linesort accepts -t (two-opt) and -f (follow / no reorder of first point)
#
# Prefer `deoverlap` (corridor proximity) over vpype's `deduplicate` (endpoint
# match only, and historically unsafe across layers). Never run deoverlap on
# dab/stipple layers such as parks_filling. Use self_overlap=true on layers whose
# outlines are single rings with near-parallel opposite sides (roads).

[layers.outlines]
ops = [
  { name = "snap", tolerance = "0.05mm" },
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

[layers.roads_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  # self_overlap: thin park drives are one continuous outline — opposite
  # kerbs must suppress each other, not only collide with other geometries.
  { name = "deoverlap", tolerance = "0.15mm", self_overlap = true },
  { name = "linesort", two_opt = true },
]

[layers.roads_details]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_details]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

[layers.buildings_filling]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  # Fill hatch merges more aggressively so the diagonals read as one stroke.
  { name = "linemerge", tolerance = "0.3mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

# Park outlines are already real dash segments (~0.45mm on / 0.40mm gap).
# Do NOT linemerge (would stitch dashes into a solid fence) or deoverlap
# (adjacent dashes are meant to sit closer than a pen width along the ring).
[layers.parks_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.05mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "linesort", two_opt = true },
]

# Dots are independent ~0.2mm dabs. Do NOT filter them (filter_min 0.15mm
# would wipe short marks), do not linemerge (would stitch marks into streaks),
# and do not deoverlap (the grid is meant to sit closer than a pen width).
# Sort with follow only so the grid order stays a raster scan.
[layers.parks_filling]
ops = [
  { name = "linesort", two_opt = false, follow = true },
]

[layers.water_outlines]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "linemerge", tolerance = "0.25mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true },
]

# Waves are already continuous polylines; merging them is wasteful.
[layers.water_filling]
ops = [
  { name = "linesimplify", tolerance = "0.1mm" },
  { name = "filter", tolerance = "0.15mm" },
  { name = "deoverlap", tolerance = "0.1mm" },
  { name = "linesort", two_opt = true, follow = true },
]

# --- bed placement (SVG page → machine coords) ------------------------------
[placement]
# Usable bed after home (mm).
bed_width_mm = 200.0
bed_height_mm = 140.0
# Where the SVG page top-left corner goes in machine space.
origin_x_mm = 0.0
origin_y_mm = 140.0
# SVG +Y is down; machine +Y is toward home (north). Flip before shift.
flip_y = true
# "page" keeps postcard padding; "content" packs ink to the origin (eats margin).
anchor = "page"
# Drop consecutive G0/G1 moves shorter than this (mm) when scrubbing output.
scrub_min_mm = 0.15

# --- G-code job splitting (FluidNC cannot open huge single files) -----------
# Two independent knobs, then how parts hand off to each other:
#   1. by_layer     — one raw file per SVG layer (roads, parks, …)
#   2. max_lines    — further split any file over N G-code lines (at pen-up)
#   3. chain        — append $SD/Run=…/part_NN.gcode so FluidNC auto-starts next
[gcode]
by_layer = true
# 0 = do not split on line count (only by_layer). ~8000 keeps SD opens reliable.
max_lines_per_file = 8000
# "all"           — every part starts the next (within a layer AND across layers)
# "within_layer"  — only chunk→chunk inside the same layer; start each layer yourself
# "none"          — no auto-run; start each part_XX manually
chain = "all"

# --- feeds (mm/min and Z heights) — declare once, referenced as $name below --
[feeds]
travel_xy = 12000  # G0 between strokes (was 8000)
pen_z = 5000       # pen up/down — short Z move, run it fast (was 2000)
draw_xy = 4000     # ink on paper (was 3500; machine-safe ~3000–4000)
pen_up = 2         # Z when pen is up (was 4; ~2mm clears paper, halves lift time)
pen_down = 0       # Z when drawing

# --- gcode writer (vpype-gcode profile) --------------------------------------
# NOT FluidNC config. vpype-gcode fills {x}/{y}; export expands $feeds names
# first, then hands the result to vpype. Output is normal Grbl/FluidNC G-code.
[gwrite.plotter]
unit = "mm"
invert_y = false

document_start = """G21
G90
G94
G10 L2 P1 X0 Y0 Z0
G92.1
$HZ
$H
G1 Z$pen_up F$pen_z
"""

layer_start = ""
line_start = ""

segment_first = """G0 X{x:.4f} Y{y:.4f} F$travel_xy
G1 Z$pen_down F$pen_z
"""
segment = """G1 X{x:.4f} Y{y:.4f} F$draw_xy
"""
line_end = """G1 Z$pen_up F$pen_z
"""

document_end = """G1 Z$pen_up F$pen_z
G10 L2 P1 X0 Y0 Z0
G92.1
$HZ
$H
G1 Z$pen_up F$pen_z
"""
