# Deprecated — export uses configs/fluidnc.toml (feeds expanded at runtime).
# Kept only so a bare `vpype gwrite` still has a plotter profile.

[gwrite.plotter]
unit = "mm"
invert_y = false
document_start = "G21\nG90\nG94\n"
segment_first = "G0 X{x:.4f} Y{y:.4f}\nG0 Z0\n"
segment = "G1 X{x:.4f} Y{y:.4f} F3500\n"
line_end = "G0 Z4\n"
document_end = "G0 Z4\n"
